<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Waynedale Routes</title>
<style>
  /* ── Theme variables ── */
  :root {
    --bg: #111;
    --text: #eee;
    --panel: #1e1e1e;
    --panel2: #1a1a1a;
    --border: #2a2a2a;
    --border2: #222;
    --input-bg: #1e1e1e;
    --input-border: #333;
    --btn-bg: #2a2a2a;
    --accent: #e94560;
    --accent-soft: #ff8099;
    --detail: #d0d0d0;   /* address ranges — brighter */
    --zip: #cccccc;      /* zip code — brighter */
    --count: #999;
    --hint: #666;
  }
  :root[data-theme="light"] {
    --bg: #f4f4f7;
    --text: #161616;
    --panel: #ffffff;
    --panel2: #f0f0f4;
    --border: #d8d8e0;
    --border2: #e4e4ea;
    --input-bg: #ffffff;
    --input-border: #c6c6d0;
    --btn-bg: #e7e7ee;
    --accent: #d4194a;
    --accent-soft: #e0466f;
    --detail: #333333;
    --zip: #444444;
    --count: #777;
    --hint: #999;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 12px;
    transition: background 0.15s, color 0.15s;
  }

  .bar { display: flex; gap: 8px; }
  #query {
    flex: 1;
    min-width: 0;
    font-size: 1.8rem;
    padding: 10px 14px;
    border: 2px solid var(--input-border);
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  #query:focus { border-color: var(--accent); }

  .btn {
    font-size: 1.5rem;
    padding: 10px 13px;
    border: none;
    border-radius: 10px;
    background: var(--btn-bg);
    color: var(--text);
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active, .btn.active { background: var(--accent); }

  #results {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Single unambiguous result */
  .big-result {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
  }
  .big-result .carrier {
    font-size: clamp(5rem, 22vw, 11rem);
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -2px;
  }
  .big-result .detail {
    font-size: clamp(1.3rem, 5vw, 2rem);
    font-weight: 700;
    color: var(--detail);
    margin-top: 12px;
  }
  .big-result .zip {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--zip);
    margin-top: 6px;
  }

  /* Multiple results list */
  .result-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
    border-radius: 10px;
    padding: 14px 18px;
    border: 1px solid var(--border);
  }
  .result-item .carrier {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--accent);
    min-width: 90px;
  }
  .result-item .info { flex: 1; }
  .result-item .street {
    font-size: 1.15rem;
    font-weight: bold;
  }
  .result-item .range {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--detail);
    margin-top: 3px;
  }

  /* Status / hint */
  .hint {
    text-align: center;
    color: var(--hint);
    font-size: 1rem;
    padding: 20px;
  }

  /* ── Carrier reverse-lookup view ── */
  .carrier-header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 18px;
    background: var(--panel);
    border-radius: 10px;
    border: 2px solid var(--accent);
  }
  .carrier-header .code {
    font-size: 2.6rem;
    font-weight: 900;
    color: var(--accent);
  }
  .carrier-header .count {
    font-size: 0.95rem;
    color: var(--count);
  }
  .carrier-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel2);
    border-radius: 8px;
    border: 1px solid var(--border2);
  }
  .carrier-item .ci-carrier {
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--accent);
    min-width: 56px;
  }
  .carrier-item .ci-info { flex: 1; }
  .carrier-item .ci-street {
    font-size: 1.05rem;
    font-weight: bold;
  }
  .carrier-item .ci-detail {
    font-size: 1rem;
    font-weight: 700;
    color: var(--detail);
    margin-top: 3px;
  }

  /* Voice listening indicator */
  #query.listening {
    border-color: var(--accent);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%,100% { border-color: var(--accent); }
    50%      { border-color: var(--accent-soft); }
  }
</style>
</head>

const DIRECTION_MAP = {north:'N',south:'S',east:'E',west:'W',n:'N',s:'S',w:'W'};
const PARITY_MAP    = {even:'E',odd:'O',e:'E',o:'O'};
const CARRIER_RE    = /^[CcRr]\d{1,3}$/;

function parseQuery(raw) {
  const text = raw.toLowerCase().replace(/\b(\d+)\s+hundred\b/g, (_,n) => String(parseInt(n)*100));
  let number=null, isBlock=false, direction=null, parity=null;
  const streetWords=[];
  for (const token of text.trim().split(/\s+/)) {
    if (!token) continue;
    if (/^\d+$/.test(token)) {
      const n=parseInt(token);
      if (token.length<=2) { number=n*100; isBlock=true; }
      else                  { number=n;    isBlock=false; }
    } else if (token in PARITY_MAP)    { parity=PARITY_MAP[token]; }
    else if (token in DIRECTION_MAP)   { direction=DIRECTION_MAP[token]; }
    else                               { streetWords.push(token); }
  }
  return {number,isBlock,direction,parity,streetWords};
}

function doSearch(raw) {
  if (!raw.trim()) return [];
  const {number,isBlock,direction,parity,streetWords}=parseQuery(raw);
  const results=[];
  for (const r of ROUTES) {
    const [zip,street,start,end,rParity,carrier]=r;
    if (number!==null) {
      if (isBlock) { if (start>number+99||end<number) continue; }
      else         { if (start>number||end<number)    continue; }
    }
    if (parity) {
      if (rParity && rParity!==parity) continue;
    } else if (number!==null && !isBlock) {
      const auto=number%2===0?'E':'O';
      if (rParity && rParity!==auto) continue;
    }
    if (direction) {
      if (!street.startsWith(direction+' ') && !street.includes(' '+direction)) continue;
    }
    let wordMatch=true;
    for (const word of streetWords) {
      const low=street.toLowerCase();
      if (word.length===1) { if (!low.startsWith(word)&&!low.includes(' '+word)){wordMatch=false;break;} }
      else                 { if (!low.includes(word)){wordMatch=false;break;} }
    }
    if (!wordMatch) continue;
    results.push({zip,street,start,end,parity:rParity,carrier});
    if (results.length>=30) break;
  }
  return results;
}

function doCarrier(raw) {
  const upper=raw.trim().toUpperCase();
  if (!CARRIER_RE.test(upper)) return [];
  const prefix=upper[0];
  const digits=upper.slice(1);
  return ROUTES
    .filter(r=>r[5].toUpperCase().startsWith(prefix)&&r[5].slice(1).includes(digits))
    .map(r=>({zip:r[0],street:r[1],start:r[2],end:r[3],parity:r[4],carrier:r[5]}));
}

const queryEl  = document.getElementById('query');
const resultsEl= document.getElementById('results');
const micBtn   = document.getElementById('micBtn');
const themeBtn = document.getElementById('themeBtn');
let debounce;

// ── Light / dark theme ──
function applyTheme(mode) {
  if (mode === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    themeBtn.textContent = '☀️';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
  }
}
let theme = localStorage.getItem('theme') || 'dark';
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  theme = (theme === 'light') ? 'dark' : 'light';
  localStorage.setItem('theme', theme);
  applyTheme(theme);
});

queryEl.addEventListener('input', ()=>{
  clearTimeout(debounce);
  debounce=setTimeout(()=>runSearch(queryEl.value),220);
});

function clearAll() {
  queryEl.value='';
  resultsEl.innerHTML='<p class="hint">Type or speak an address — number, street, even/odd<br>Or type C087 / R008 to list all streets on a route</p>';
  queryEl.focus();
}

function par(code) { return code==='E'?' · Even':code==='O'?' · Odd':''; }

function runSearch(q) {
  const trimmed=q.trim();
  if (!trimmed){clearAll();return;}
  if (CARRIER_RE.test(trimmed)) renderCarrier(doCarrier(trimmed));
  else                          renderSearch(doSearch(trimmed));
}

function renderSearch(results) {
  if (!results.length){resultsEl.innerHTML='<p class="hint">No match — try just the street name or number</p>';return;}
  if (results.length===1) {
    const r=results[0];
    resultsEl.innerHTML=`<div class="big-result"><div class="carrier">${r.carrier}</div><div class="detail">${r.street} &nbsp; ${r.start}–${r.end}${par(r.parity)}</div><div class="zip">${r.zip}</div></div>`;
    return;
  }
  resultsEl.innerHTML=results.map(r=>`
    <div class="result-item">
      <div class="carrier">${r.carrier}</div>
      <div class="info">
        <div class="street">${r.street}</div>
        <div class="range">${r.start}–${r.end}${par(r.parity)} &nbsp;·&nbsp; ${r.zip}</div>
      </div>
    </div>`).join('');
}

function renderCarrier(results) {
  if (!results.length){resultsEl.innerHTML='<p class="hint">No streets found for that carrier</p>';return;}
  const codes=[...new Set(results.map(r=>r.carrier))].sort().join(', ');
  resultsEl.innerHTML=
    `<div class="carrier-header"><span class="code">${codes}</span><span class="count">${results.length} entries</span></div>`+
    results.map(r=>`
      <div class="carrier-item">
        <div class="ci-carrier">${r.carrier}</div>
        <div class="ci-info">
          <div class="ci-street">${r.street}</div>
          <div class="ci-detail">${r.start}–${r.end}${par(r.parity)} · ${r.zip}</div>
        </div>
      </div>`).join('');
}

const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
if (SpeechRec) {
  const rec=new SpeechRec();
  rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  let listening=false;
  rec.onresult=e=>{const t=e.results[0][0].transcript;queryEl.value=t;runSearch(t);};
  rec.onend=()=>{listening=false;queryEl.classList.remove('listening');micBtn.classList.remove('active');};
  rec.onerror=()=>{listening=false;queryEl.classList.remove('listening');micBtn.classList.remove('active');};
  function startRec(e){e.preventDefault();if(listening)return;listening=true;queryEl.classList.add('listening');micBtn.classList.add('active');try{rec.start();}catch(_){}}
  function stopRec(e){e.preventDefault();if(!listening)return;try{rec.stop();}catch(_){}}
  micBtn.addEventListener('mousedown',startRec);
  micBtn.addEventListener('touchstart',startRec,{passive:false});
  micBtn.addEventListener('mouseup',stopRec);
  micBtn.addEventListener('touchend',stopRec,{passive:false});
  micBtn.addEventListener('mouseleave',stopRec);
} else { micBtn.style.display='none'; }
